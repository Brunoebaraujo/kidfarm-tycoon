<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KidFarm Tycoon</title>
  <meta name="description" content="Plant, harvest, hire, and grow your farm. A farming and entrepreneurship game for kids 8–12." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@19/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      background: #0e0b07;
      color: #e8d9b0;
      font-family: 'Open Sans', sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.4); }
    ::-webkit-scrollbar-thumb { background: #7a5a08; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #c8960c; }

    /* ── Layout ── */
    #root { display: flex; flex-direction: column; }
    .aoe-topbar {
      background: linear-gradient(180deg,#0e0b07 0%,#1a1408 50%,#0e0b07 100%);
      border-bottom: 2px solid #7a5a08;
      box-shadow: 0 2px 12px rgba(0,0,0,.9);
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 2px;
      height: 44px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .aoe-resource {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 8px;
      border-left: 1px solid rgba(90,69,32,.4);
      min-width: 64px;
    }
    .aoe-resource:first-child { border-left: none; }
    .aoe-resource-icon { font-size: 15px; line-height: 1; }
    .aoe-resource-label { font-size: 9px; color: #7a6a48; text-transform: uppercase; letter-spacing: .5px; line-height: 1; }
    .aoe-resource-value { font-family:'Cinzel',serif; font-size: 12px; font-weight: 600; color: #f0d060; line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
    .aoe-resource-value.pos { color: #7ad060; }
    .aoe-resource-value.neg { color: #e05030; }
    .aoe-topbar-divider { width:1px; height:26px; background:linear-gradient(180deg,transparent,#7a5a08,transparent); margin:0 4px; flex-shrink:0; }
    .game-title { font-family:'Cinzel',serif; font-size:14px; font-weight:700; color:#f0d060; letter-spacing:2px; margin-right:6px; text-shadow:0 2px 6px rgba(200,150,12,.5); }

    /* ── Main area ── */
    .main-layout { flex: 1; display: flex; gap: 6px; padding: 6px; min-height: 0; overflow: hidden; }
    .map-wrap { position: relative; flex: 1; overflow: hidden; border-radius: 3px; border: 1px solid #4a3a1a; background: #0a0804; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 8px rgba(0,0,0,.7); }
    canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }

    /* ── Right panel ── */
    .right-panel { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
    .aoe-panel { background: rgba(14,11,7,.96); border: 1px solid #4a3a1a; border-radius: 3px; padding: 8px 10px; position: relative; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 8px rgba(0,0,0,.6); }
    .aoe-panel::before, .aoe-panel::after { content:''; position:absolute; width:6px; height:6px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#c8960c,#5a3a08); box-shadow:0 1px 2px rgba(0,0,0,.8); top:5px; z-index:1; }
    .aoe-panel::before { left:5px; } .aoe-panel::after { right:5px; }
    .panel-title { font-family:'Cinzel',serif; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:#c8960c; padding-bottom:5px; border-bottom:1px solid #4a3a1a; margin-bottom:6px; text-shadow:0 1px 4px rgba(200,150,12,.4); }
    .status-line { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:2px 0; font-size:10px; border-bottom:1px solid rgba(90,69,32,.15); }
    .status-line:last-child { border-bottom:none; }
    .status-lbl { color:#7a6a48; font-size:9px; text-transform:uppercase; letter-spacing:.5px; }
    .status-val { color:#d8c89a; font-weight:600; font-size:10px; text-align:right; }
    .status-val.green { color:#7ad060; } .status-val.red { color:#e05030; } .status-val.gold { color:#f0d060; }

    /* ── Day progress ── */
    .daybar-wrap { position:absolute; left:6px; right:6px; bottom:6px; height:5px; background:rgba(0,0,0,.7); border:1px solid #4a3a1a; border-radius:1px; overflow:hidden; }
    .daybar-fill { height:100%; background:linear-gradient(90deg,#c8780c,#f0c030,#f8e060); border-radius:1px; box-shadow:0 0 6px rgba(240,192,48,.5); }

    /* ── Message ── */
    .aoe-message { position:absolute; left:8px; top:8px; max-width:72%; background:rgba(10,8,4,.88); border:1px solid #4a3a1a; border-radius:2px; padding:5px 10px; font-size:11px; color:#d8c89a; pointer-events:none; box-shadow:0 2px 8px rgba(0,0,0,.8); }

    /* ── Season banner ── */
    .aoe-banner { position:absolute; left:50%; top:10px; transform:translateX(-50%); padding:7px 22px; font-family:'Cinzel',serif; font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#fdf0c0; background:linear-gradient(180deg,rgba(80,50,8,.97),rgba(40,28,4,.97)); border:1px solid #c8960c; border-radius:2px; box-shadow:0 4px 20px rgba(0,0,0,.9),0 0 30px rgba(200,150,12,.2); text-shadow:0 2px 6px rgba(200,150,12,.6); white-space:nowrap; animation:fadein .35s ease-out both; pointer-events:none; }
    @keyframes fadein { from{opacity:0;transform:translateX(-50%) translateY(-8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

    /* ── Buttons ── */
    .btn { font-family:'Cinzel',serif; font-size:10px; font-weight:600; letter-spacing:.5px; padding:6px 10px; background:linear-gradient(180deg,#3a2e18 0%,#251e0e 50%,#1e1808 100%); color:#e8c060; border:1px solid #7a5a08; border-radius:2px; cursor:pointer; text-transform:uppercase; transition:background 120ms,color 120ms; box-shadow:inset 0 1px 0 rgba(255,220,80,.1),0 2px 4px rgba(0,0,0,.6); width:100%; margin-bottom:3px; }
    .btn:hover:not(:disabled) { background:linear-gradient(180deg,#4e3e20 0%,#3a2e14 100%); color:#f0d060; border-color:#c8960c; }
    .btn:active:not(:disabled) { transform:translateY(1px); }
    .btn:disabled { opacity:.38; cursor:not-allowed; }
    .btn.primary { background:linear-gradient(180deg,#6a4e10 0%,#4a3408 50%,#3a2808 100%); color:#fdf0c0; border-color:#c8960c; }
    .btn.primary:hover:not(:disabled) { background:linear-gradient(180deg,#7a5e18 0%,#5a4010 100%); }
    .btn.accent { background:linear-gradient(180deg,#2a4a10 0%,#1a3008 100%); color:#b0e060; border-color:#4a7a18; }
    .btn.accent:hover:not(:disabled) { background:linear-gradient(180deg,#3a5a18 0%,#284010 100%); color:#d0f080; }
    .btn.danger { background:rgba(120,20,10,.6); border-color:#8a2010; color:#ffb0a0; }

    /* ── Modal ── */
    .modal-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.72); backdrop-filter:blur(1px); z-index:100; }
    .modal-box { background:linear-gradient(180deg,#1a1408,#100e06); border:1px solid #7a5a08; border-radius:3px; padding:16px; box-shadow:0 0 0 1px rgba(90,69,32,.4),0 8px 40px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,220,80,.06); min-width:300px; max-width:440px; max-height:88vh; overflow-y:auto; position:relative; }
    .modal-box::before,.modal-box::after { content:''; position:absolute; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#c8960c,#5a3a08); box-shadow:0 1px 3px rgba(0,0,0,.9); }
    .modal-box::before { top:8px; left:8px; } .modal-box::after { top:8px; right:8px; }
    .modal-title { font-family:'Cinzel',serif; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:#f0d060; text-align:center; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #4a3a1a; text-shadow:0 2px 6px rgba(200,150,12,.4); }

    /* ── Item cards ── */
    .item-card { background:rgba(0,0,0,.35); border:1px solid rgba(90,69,32,.35); border-radius:2px; padding:8px 10px; margin-bottom:6px; }
    .item-name { font-family:'Cinzel',serif; font-size:11px; font-weight:600; color:#f0d060; margin-bottom:3px; }
    .item-desc { font-size:10px; color:#7a6a48; line-height:1.5; }
    .item-grid { display:grid; grid-template-columns:1fr 1fr; gap:2px 10px; font-size:10px; color:#d8c89a; margin:4px 0; }
    .item-grid .pos { color:#7ad060; } .item-grid .neg { color:#e05030; }
    .tabs { display:flex; gap:3px; margin-bottom:10px; }
    .tab { font-family:'Cinzel',serif; font-size:9px; font-weight:600; padding:5px 10px; text-transform:uppercase; background:rgba(0,0,0,.4); border:1px solid rgba(90,69,32,.4); border-radius:2px 2px 0 0; color:#7a6a48; cursor:pointer; flex:1; transition:all 120ms; }
    .tab.active { background:rgba(80,55,10,.6); border-color:#7a5a08; color:#f0d060; }
    .tab:hover:not(.active) { color:#d8c89a; }

    /* ── Worker card ── */
    .worker-row { display:flex; align-items:stretch; gap:3px; background:rgba(0,0,0,.3); border:1px solid rgba(90,69,32,.3); border-radius:2px; margin-bottom:3px; overflow:hidden; }
    .worker-row.selected { border-color:#7a5a08; background:rgba(120,80,10,.18); }
    .worker-main { flex:1; padding:5px 8px; cursor:pointer; border:none; background:transparent; text-align:left; }
    .worker-main:hover { background:rgba(255,255,255,.04); }
    .worker-name { font-family:'Cinzel',serif; font-size:11px; color:#d8c89a; }
    .worker-name.selected { color:#f0d060; }
    .worker-sub { font-size:9px; color:#7a6a48; margin-top:1px; }
    .worker-find { padding:0 10px; border:none; border-left:1px solid rgba(90,69,32,.3); background:transparent; color:#7a6a48; font-family:'Cinzel',serif; font-size:9px; cursor:pointer; text-transform:uppercase; }
    .worker-find:hover { background:rgba(255,255,255,.04); color:#d8c89a; }

    /* ── Chart ── */
    .chart-wrap svg { background:rgba(0,0,0,.4); border:1px solid rgba(90,69,32,.35); display:block; max-width:100%; border-radius:1px; }
    .chart-legend { display:flex; justify-content:space-between; font-size:9px; color:#7a6a48; margin-top:2px; }

    /* ── Journal ── */
    .journal-entry { font-size:10px; padding:4px 0; border-bottom:1px solid rgba(90,69,32,.18); color:#d8c89a; line-height:1.5; }
    .journal-day { font-family:'Cinzel',serif; font-size:9px; color:#c8960c; margin-right:4px; }

    /* ── Inventory section label ── */
    .inv-section { font-size:9px; color:#7a5a08; text-transform:uppercase; letter-spacing:1px; margin:5px 0 2px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useRef, useState, useEffect, useCallback } = React;

/* ════════════════════════════════════════════════════════════
   CONSTANTS & TYPES
   ════════════════════════════════════════════════════════════ */
const TILE=32, MAP_W=22, MAP_H=16;
const FIELD_AREA={x0:3,y0:5,x1:12,y1:12};
const SHIPPING_BIN={x:16,y:11};
const FARMHOUSE={x:9,y:1,w:5,h:3};
const BARN={x:14,y:8,w:3,h:3};
const COOP={x:17,y:8,w:3,h:2};
const WELL={x:13,y:6};
const TOOLSHED={x:2,y:3,w:2,h:2};
const SEASON_TREE={x:20,y:4};
const MILKING_PARLOR={x:18,y:1,w:3,h:3};
const COW_TILE={x:19,y:3};
const SAVE_KEY="kidfarm-save-v2";
const DAY_MS=90000;
const DAILY_COST=8;
const HIRE_COST_BASE=50;
const SEASON_DAYS=10;
const HISTORY_DAYS=30;
const JOURNAL_MAX=100;
const HOUR_MS=750;
const TASK_MANUAL_MS={prepare:4*HOUR_MS,plant:2*HOUR_MS,harvest:3*HOUR_MS,milk:2*HOUR_MS,deliver:2*HOUR_MS};
const EQUIPMENT_PRICES={manualPlow:75,tractor:300,harvester:500};
const EQUIPMENT_LABELS={manualPlow:"Manual Plow",tractor:"Tractor",harvester:"Harvester"};
const NIGHT_START_FRACTION=14/16;
const TRACTOR_PLANT_MAX=10, TRACTOR_PREPARE_MAX=4, HARVESTER_MAX=4;
const SEASON_ORDER=["spring","summer","autumn","winter"];
const SEASON_LABEL={spring:"Spring",summer:"Summer",autumn:"Autumn",winter:"Winter"};
const CROP_ORDER=["wheat","rice","corn","banana"];
const PRODUCT_ORDER=["wheat","rice","corn","banana","milk"];

const CROPS={
  wheat:{id:"wheat",name:"Wheat",seedCost:2,yield:4,basePrice:3,stalk:"#e3b94a",leaf:"#7ec84a",fruit:"#fcdc70"},
  rice:{id:"rice",name:"Rice",seedCost:4,yield:5,basePrice:4,stalk:"#cfe07a",leaf:"#9ee062",fruit:"#f4f1c1"},
  corn:{id:"corn",name:"Corn",seedCost:8,yield:6,basePrice:7,stalk:"#3aa860",leaf:"#2a7a2a",fruit:"#f5c530"},
  banana:{id:"banana",name:"Banana",seedCost:15,yield:8,basePrice:12,stalk:"#7a4a25",leaf:"#3fa83f",fruit:"#f7d94a"},
};

const GROW_DAYS={
  wheat:{spring:1,summer:1,autumn:2,winter:3},
  rice:{spring:2,summer:1,autumn:2,winter:4},
  corn:{spring:3,summer:2,autumn:4,winter:6},
  banana:{spring:5,summer:4,autumn:6,winter:8},
};
const PRICE_MOD={
  wheat:{spring:0,summer:-1,autumn:1,winter:3},
  rice:{spring:2,summer:1,autumn:0,winter:-1},
  corn:{spring:0,summer:2,autumn:1,winter:-2},
  banana:{spring:-1,summer:3,autumn:2,winter:0},
};
const MILK_BASE_PRICE=5;
const MILK_PRICE_MOD={spring:0,summer:-1,autumn:1,winter:2};
const MILK_YIELD=2;
const SEASON_TINT={spring:"#9ee062",summer:"#3aa860",autumn:"#e08a3a",winter:"#cfe9f5"};
const TASK_LABELS={prepare:"Prepare Soil",plant:"Plant",harvest:"Harvest",milk:"Milk Cow",deliver:"Deliver Goods"};

const COLORS={
  sky:"#a9d8ef",grass:"#7ec84a",grassDark:"#5fa934",grassLight:"#9ee062",
  path:"#c9a36a",pathDark:"#9a7846",soilDry:"#6b4a2b",soil:"#5a3a20",soilWet:"#3e2814",
  wood:"#7a4a25",woodDark:"#4a2a12",woodLight:"#a87340",
  roof:"#b8442e",roofDark:"#7a2818",roofLight:"#e0633d",
  stone:"#8a8a92",stoneDark:"#5a5a62",water:"#4a8cd6",waterLight:"#7ab8f0",
  leafDark:"#2a7a2a",skin:"#f6c79a",hairBlonde:"#f0d36a",hairBrown:"#5a3318",hairBlack:"#1d1416",
  shirtRed:"#c84a3a",shirtBlue:"#3a78c8",shirtGreen:"#3aa860",
  jeans:"#2a3e72",hatBrown:"#7a4a2a",shadow:"rgba(0,0,0,0.25)",
  white:"#fdf6e3",black:"#1a1410",selected:"#fff06a",
};

function px(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function emptyInv(){return{wheat:0,rice:0,corn:0,banana:0,milk:0};}
function emptySeeds(){return{wheat:0,rice:0,corn:0,banana:0};}
function createFields(){
  const w=FIELD_AREA.x1-FIELD_AREA.x0+1,h=FIELD_AREA.y1-FIELD_AREA.y0+1;
  return Array.from({length:w*h},()=>({state:"empty",growth:0,growMs:0,crop:null}));
}
function makeWorker(id,name,x,y,hair,shirt){
  return{id,name,x,y,task:null,queue:[],facing:"down",workTimer:0,workTotal:0,walkPhase:0,hair,shirt};
}
function seasonForDay(day){
  return SEASON_ORDER[Math.floor((day-1)/SEASON_DAYS)%SEASON_ORDER.length];
}
function cropPriceFor(crop,season,fluct){return Math.max(1,CROPS[crop].basePrice+PRICE_MOD[crop][season]+fluct);}
function milkPriceFor(season,fluct){return Math.max(1,MILK_BASE_PRICE+MILK_PRICE_MOD[season]+fluct);}
function cropGrowMs(crop,season){return GROW_DAYS[crop][season]*DAY_MS;}
function isNightAt(dayMs){return dayMs/DAY_MS>=NIGHT_START_FRACTION;}
function getTaskDuration(kind,equipment){
  let ms=TASK_MANUAL_MS[kind];
  if(kind==="prepare"){if(equipment.tractor)ms*=0.25;else if(equipment.manualPlow)ms*=0.65;}
  else if(kind==="harvest"&&equipment.harvester)ms*=0.25;
  else if(kind==="plant"&&equipment.tractor)ms=300;
  return Math.max(120,Math.round(ms));
}
function productName(id){return id==="milk"?"Milk":CROPS[id].name;}
function taskName(task){
  if(!task)return"Idle";
  if(task.kind==="plant"&&task.crop)return`Plant ${CROPS[task.crop].name}`;
  if(task.kind==="harvest"&&task.crop)return`Harvest ${CROPS[task.crop].name}`;
  return TASK_LABELS[task.kind];
}
function workerStatus(w,isNight){
  if(w.task)return w.workTimer>0?"Busy":"Moving";
  if(isNight)return w.queue.length>0?"Resting":"Sleeping";
  return"Idle";
}

/* ════════════════════════════════════════════════════════════
   DRAW HELPERS  (same as original game)
   ════════════════════════════════════════════════════════════ */
function drawGrassTile(ctx,x,y,seed,season){
  const base=season==="winter"?"#cfe1ea":season==="autumn"?"#a8b85a":COLORS.grass;
  const dark=season==="winter"?"#9fb8c4":season==="autumn"?"#7a8a3a":COLORS.grassDark;
  const light=season==="winter"?"#e6f0f5":season==="autumn"?"#c8d070":COLORS.grassLight;
  px(ctx,x,y,TILE,TILE,base);
  const a=(seed*9301+49297)%233280;
  const r1=(a>>2)%TILE,r2=(a>>5)%TILE;
  px(ctx,x+r1,y+r2,2,2,dark);
  px(ctx,x+((r1+11)%TILE),y+((r2+7)%TILE),2,1,light);
}
function drawSoilTile(ctx,x,y,prepared){
  px(ctx,x,y,TILE,TILE,prepared?COLORS.soilWet:COLORS.soilDry);
  for(let i=4;i<TILE;i+=8){
    px(ctx,x+2,y+i,TILE-4,1,COLORS.soil);
    px(ctx,x+2,y+i+2,TILE-4,1,prepared?COLORS.soilDry:COLORS.soilWet);
  }
  px(ctx,x,y,TILE,1,COLORS.black);px(ctx,x,y+TILE-1,TILE,1,COLORS.black);
}
function stageHeight(state){
  switch(state){case"planted":return 3;case"growing1":return 8;case"growing2":return 13;case"growing3":return 18;case"ready":return 22;default:return 0;}
}
function drawCrop(ctx,x,y,state,crop){
  drawSoilTile(ctx,x,y,true);
  const def=CROPS[crop],h=stageHeight(state),ready=state==="ready";
  if(crop==="banana"){
    px(ctx,x+TILE/2-1,y+28-h,2,h,def.stalk);
    const crown=Math.max(2,Math.floor(h/2));
    px(ctx,x+TILE/2-crown,y+28-h-3,crown*2,3,def.leaf);
    px(ctx,x+TILE/2-crown-2,y+28-h-1,crown*2+4,2,def.leaf);
    if(ready){px(ctx,x+TILE/2-4,y+28-h+2,3,5,def.fruit);px(ctx,x+TILE/2+1,y+28-h+2,3,5,def.fruit);}
  }else if(crop==="corn"){
    for(let i=0;i<3;i++){const sx=x+8+i*8;px(ctx,sx,y+28-h,2,h,def.stalk);px(ctx,sx-3,y+26-h,8,3,def.leaf);if(ready)px(ctx,sx,y+22-h,2,5,def.fruit);}
  }else{
    for(let i=0;i<4;i++){const sx=x+6+i*6;px(ctx,sx,y+26-h,1,h,ready?def.stalk:def.leaf);px(ctx,sx-2,y+25-h,5,ready?6:3,ready?def.fruit:def.leaf);}
  }
}
function drawFarmhouse(ctx,x,y,w,h){
  px(ctx,x+6,y+h-3,w-12,3,COLORS.shadow);
  const wt=y+Math.floor(h*0.42),wb=y+h-4,wl=x+6,wr=x+w-6,ww=wr-wl,wh=wb-wt;
  px(ctx,wl,wt,ww,wh,COLORS.woodLight);
  for(let i=6;i<wh;i+=6)px(ctx,wl,wt+i,ww,1,COLORS.wood);
  px(ctx,wl-1,wb,ww+2,4,COLORS.stoneDark);
  const rh=wt-(y+2),eaves=4;
  for(let r=0;r<rh;r++){const t=r/rh,ins=Math.floor(t*(ww/2+eaves));px(ctx,wl-eaves+ins,y+2+r,(ww+eaves*2)-ins*2,1,r<2?COLORS.roofDark:COLORS.roof);}

function drawCow(ctx,cx,cy,milked,time){

function drawSeasonTree(ctx,tx,ty,season,time){
  const baseX=tx*TILE+TILE,baseY=(ty+2)*TILE+TILE-2;
  ctx.fillStyle=COLORS.shadow;ctx.beginPath();ctx.ellipse(baseX,baseY+2,22,5,0,0,Math.PI*2);ctx.fill();

    for(const a of[-1.1,-0.6,-0.1,0.4,0.9,1.3]){ctx.beginPath();ctx.moveTo(baseX,baseY-trunkH+4);ctx.lineTo(baseX+Math.cos(a)*22,cy2+Math.sin(a)*12);ctx.stroke();}

    if(season==="autumn"){leaf="#e08a3a";leafDark="#a04a18";leafLight="#f5c43a";}
    const sway=Math.sin(time*0.0015)*1.2;
    const blob=(cx,cy,r2,c)=>{for(let dy=-r2;dy<=r2;dy+=2){const w2=Math.floor(Math.sqrt(Math.max(0,r2*r2-dy*dy)))*2;px(ctx,cx-w2/2,cy+dy,w2,2,c);}};
    blob(baseX+sway,cy2,r,leafDark);blob(baseX-10+sway,cy2-4,16,leaf);
    blob(baseX+10+sway,cy2+2,18,leaf);blob(baseX+sway,cy2-10,14,leafLight);
    if(season==="spring"){for(const[dx,dy]of[[-12,-4],[-2,6],[10,-2],[16,6],[-18,4],[4,-10]]){px(ctx,baseX+dx,cy2+dy,3,3,"#f7a8c8");}}
    if(season==="autumn"){
      for(const[dx,dy]of[[-14,2],[12,-6],[-4,10],[18,0]])px(ctx,baseX+dx,cy2+dy,3,3,"#c83a2a");

function drawWorker(ctx,worker,isSelected){

}

/* ════════════════════════════════════════════════════════════
   MINI CHART
   ════════════════════════════════════════════════════════════ */
function MiniChart({data,color}){
  const w=240,h=50;
  if(!data||data.length===0)return React.createElement('div',{style:{fontSize:9,color:"#7a6a48"}},"No data yet.");
  const prices=data.map(d=>d.price);
  const min=Math.min(...prices),max=Math.max(...prices),range=Math.max(1,max-min);
  const step=data.length>1?w/(data.length-1):0;
  const pts=data.map((d,i)=>`${i*step},${h-((d.price-min)/range)*(h-10)-5}`).join(" ");
  return React.createElement('div',{className:"chart-wrap"},
    React.createElement('svg',{width:w,height:h,style:{maxWidth:"100%"}},
      React.createElement('polyline',{points:pts,fill:"none",stroke:color,strokeWidth:1.5,strokeLinejoin:"round"}),
      data.map((d,i)=>React.createElement('circle',{key:i,cx:i*step,cy:h-((d.price-min)/range)*(h-10)-5,r:2,fill:color}))
    ),
    React.createElement('div',{className:"chart-legend"},
      React.createElement('span',null,`Day ${data[0].day}`),
      React.createElement('span',null,`Low ${min}c · High ${max}c`),
      React.createElement('span',null,`Day ${data[data.length-1].day}`)
    )
  );
}

/* ════════════════════════════════════════════════════════════
   MAIN GAME COMPONENT
   ════════════════════════════════════════════════════════════ */
function KidFarmGame(){
  const canvasRef=useRef(null);
  const wrapRef=useRef(null);
  const nextId=useRef(1);

  const initSeason=seasonForDay(1);
  const initPrices={wheat:cropPriceFor("wheat",initSeason,0),rice:cropPriceFor("rice",initSeason,0),corn:cropPriceFor("corn",initSeason,0),banana:cropPriceFor("banana",initSeason,0),milk:milkPriceFor(initSeason,0)};
  const initHistory={wheat:[{day:1,price:initPrices.wheat}],rice:[{day:1,price:initPrices.rice}],corn:[{day:1,price:initPrices.corn}],banana:[{day:1,price:initPrices.banana}],milk:[{day:1,price:initPrices.milk}]};

  function makeInitial(){
    return {
      coins:25,seeds:{...emptySeeds(),wheat:5},harvested:emptyInventory(),
      revenue:0,expenses:0,dayMs:0,day:1,season:initSeason,
      fluct:{wheat:0,rice:0,corn:0,banana:0,milk:0},
      history:JSON.parse(JSON.stringify(initHistory)),
      journal:[{day:1,season:initSeason,text:"Spring has arrived — welcome to KidFarm!"}],
      seasonBanner:{text:"Spring has arrived",age:0,ttl:3500},
      fields:createFields(),
      workers:[makeWorker("maya","Maya",10*TILE+TILE/2,4*TILE+TILE/2,COLORS.hairBlonde,COLORS.shirtRed)],
      selectedWorkerId:"maya",
      cow:{x:COW_TILE.x*TILE+TILE/2,y:COW_TILE.y*TILE+TILE/2,lastMilkedDay:0},
      equipment:{manualPlow:false,tractor:false,harvester:false},
      isNight:false,
    };
  }

  const stateRef=useRef({
    ...makeInitial(),
    camera:{x:0,y:0,freeX:0,freeY:0},
    cssScale:2,viewportW:800,viewportH:600,
    keys:new Set(),
    pointer:{x:-1,y:-1,downAt:null,dragging:false,startX:0,startY:0,startCamX:0,startCamY:0},
    lastTime:performance.now(),
    floaters:[],
  });

  const [ui,setUi]=useState({
    coins:25,seeds:{...emptySeeds(),wheat:5},harvested:emptyInventory(),
    revenue:0,expenses:0,day:1,time:"06:00",season:initSeason,
    prices:initPrices,selectedWorkerId:"maya",selectedWorkerName:"Maya",
    selectedStatus:"Idle",selectedCurrentTask:"Idle",selectedQueueLength:0,
    workers:[{id:"maya",name:"Maya",status:"Idle",currentTask:"Idle",queueLength:0,isSelected:true}],
    message:"Select Maya, then click a soil tile to begin.",
    banner:{text:"Spring has arrived",visible:true},
    cowReady:true,isNight:false,
    equipment:{manualPlow:false,tractor:false,harvester:false},
  });

  const [plantPrompt,setPlantPrompt]=useState(null);
  const [shopOpen,setShopOpen]=useState(false);
  const [shopTab,setShopTab]=useState("seeds");
  const [marketOpen,setMarketOpen]=useState(false);
  const [journalOpen,setJournalOpen]=useState(false);

  function inField(tx,ty){return tx>=FIELD_AREA.x0&&tx<=FIELD_AREA.x1&&ty>=FIELD_AREA.y0&&ty<=FIELD_AREA.y1;}
  function fieldIdx(tx,ty){return(ty-FIELD_AREA.y0)*(FIELD_AREA.x1-FIELD_AREA.x0+1)+(tx-FIELD_AREA.x0);}
  function inMilkingParlor(tx,ty){return tx>=MILKING_PARLOR.x&&tx<MILKING_PARLOR.x+MILKING_PARLOR.w&&ty>=MILKING_PARLOR.y&&ty<MILKING_PARLOR.y+MILKING_PARLOR.h;}
  function selWorker(){const s=stateRef.current;return s.workers.find(w=>w.id===s.selectedWorkerId)??s.workers[0];}

  const setMessage=useCallback(msg=>setUi(c=>c.message===msg?c:{...c,message:msg}),[]);

  function addFloater(x,y,text,color){stateRef.current.floaters.push({x,y,text,color,age:0});}
  function logJournal(text){const s=stateRef.current;s.journal.unshift({day:s.day,season:s.season,text});if(s.journal.length>JOURNAL_MAX)s.journal.length=JOURNAL_MAX;}
  function currentPrice(crop){const s=stateRef.current;return cropPriceFor(crop,s.season,s.fluct[crop]);}

  function selectWorker(id){
    const s=stateRef.current;const w=s.workers.find(x=>x.id===id);if(!w)return;
    s.selectedWorkerId=w.id;setMessage(`Selected: ${w.name}`);syncUi(true);
  }

  function assignTask(task){
    const w=selWorker();const cmd={...task,id:nextId.current++};
    w.queue.push(cmd);setMessage(`${taskName(cmd)} queued for ${w.name}.`);syncUi(true);
  }

  function getAffectedTiles(kind,tx,ty,crop){
    const s=stateRef.current;
    let maxN=1,want=null;
    if(kind==="plant"){if(!s.equipment.tractor||!crop)return[{tx,ty}];maxN=Math.min(TRACTOR_PLANT_MAX,s.seeds[crop]??0);want="prepared";}
    else if(kind==="prepare"){if(!s.equipment.tractor)return[{tx,ty}];maxN=TRACTOR_PREPARE_MAX;want="empty";}
    else if(kind==="harvest"){if(!s.equipment.harvester)return[{tx,ty}];maxN=HARVESTER_MAX;want="ready";}
    else return[{tx,ty}];
    if(maxN<=0)return[];
    const list=[],seen=new Set(),q=[{tx,ty}];
    while(q.length>0&&list.length<maxN){
      const cur=q.shift();const key=`${cur.tx},${cur.ty}`;
      if(seen.has(key))continue;seen.add(key);
      if(!inField(cur.tx,cur.ty))continue;
      const f=s.fields[fieldIdx(cur.tx,cur.ty)];
      if(f.state===want&&(kind!=="harvest"||f.crop))list.push(cur);
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])q.push({tx:cur.tx+dx,ty:cur.ty+dy});
    }
    return list;
  }

  const handleTileClick=useCallback((tx,ty)=>{
    const s=stateRef.current;
    if(tx===SHIPPING_BIN.x&&ty===SHIPPING_BIN.y){
      const total=PRODUCT_ORDER.reduce((a,id)=>a+s.harvested[id],0);
      if(total<=0){setMessage("Nothing to deliver.");return;}
      assignTask({kind:"deliver",tx,ty});return;
    }
    if(inMilkingParlor(tx,ty)){
      if(s.isNight){setMessage("The cow is sleeping. Come back at 06:00.");return;}
      if(s.cow.lastMilkedDay===s.day){setMessage("Already milked today.");return;}
      assignTask({kind:"milk",tx:COW_TILE.x,ty:COW_TILE.y});return;
    }
    if(!inField(tx,ty)){setMessage("Click a worker, then a soil tile, the cow, or the shipping bin.");return;}
    if(s.isNight){setMessage("Workers rest at night. Work resumes at 06:00.");return;}
    const f=s.fields[fieldIdx(tx,ty)];
    if(f.state==="empty"){
      const tiles=getAffectedTiles("prepare",tx,ty);
      if(s.equipment.tractor&&tiles.length>1){queuePerTile(tiles.map(t=>({kind:"prepare",tx:t.tx,ty:t.ty})),`Tractor preparing ${tiles.length} tiles`);}
      else assignTask({kind:"prepare",tx,ty,tiles});
    }else if(f.state==="prepared"){setPlantPrompt({tx,ty});}
    else if(f.state==="ready"&&f.crop){
      const tiles=getAffectedTiles("harvest",tx,ty);
      if(s.equipment.harvester&&tiles.length>1)queuePerTile(tiles.map(t=>({kind:"harvest",tx:t.tx,ty:t.ty,crop:s.fields[fieldIdx(t.tx,t.ty)].crop??f.crop})),`Harvester collecting ${tiles.length} tiles`);
      else assignTask({kind:"harvest",tx,ty,crop:f.crop,tiles});
    }else{setMessage("This crop is still growing.");}
  },[setMessage]);

  function queuePerTile(tasks,msg){
    const w=selWorker();
    tasks.forEach(t=>w.queue.push({...t,id:nextId.current++}));
    setMessage(`${msg} queued for ${w.name}.`);syncUi(true);
  }

  function choosePlant(crop){
    const prompt=plantPrompt;setPlantPrompt(null);if(!prompt)return;
    const s=stateRef.current;
    if(s.seeds[crop]<=0){setMessage(`Not enough ${CROPS[crop].name} seeds.`);return;}
    const tiles=getAffectedTiles("plant",prompt.tx,prompt.ty,crop);
    if(s.equipment.tractor&&tiles.length>1){
      queuePerTile(tiles.map(t=>({kind:"plant",tx:t.tx,ty:t.ty,crop})),`Tractor sowing ${tiles.length} × ${CROPS[crop].name}`);
      logJournal(`Tractor sowing ${tiles.length} × ${CROPS[crop].name}`);
    }else assignTask({kind:"plant",tx:prompt.tx,ty:prompt.ty,crop,tiles});
  }

  function completeTask(worker){
    const s=stateRef.current,task=worker.task;if(!task)return;
    if(task.kind==="deliver"){
      let total=0;
      PRODUCT_ORDER.forEach(id=>{
        const qty=s.harvested[id];if(qty<=0)return;
        const price=id==="milk"?milkPriceFor(s.season,s.fluct.milk):currentPrice(id);
        const earn=qty*price;total+=earn;s.harvested[id]=0;
        logJournal(`Sold ${qty} ${productName(id)} @ ${price}c (+${earn}c)`);
      });
      s.coins+=total;s.revenue+=total;
      addFloater(worker.x,worker.y-24,`+${total}c`,"#f5c530");return;
    }
    if(task.kind==="milk"){
      if(s.cow.lastMilkedDay===s.day){setMessage("Already milked today.");return;}
      s.cow.lastMilkedDay=s.day;s.harvested.milk+=MILK_YIELD;
      addFloater(worker.x,worker.y-24,`+${MILK_YIELD} Milk`,"#fdf6e3");
      logJournal(`${worker.name} milked the cow (+${MILK_YIELD} Milk)`);return;
    }
    if(!inField(task.tx,task.ty))return;
    const tiles=task.tiles&&task.tiles.length>0?task.tiles:[{tx:task.tx,ty:task.ty}];
    if(task.kind==="prepare"){
      tiles.forEach(t=>{const f=s.fields[fieldIdx(t.tx,t.ty)];if(f.state==="empty")f.state="prepared";});
    }else if(task.kind==="plant"){
      if(!task.crop)return;const crop=task.crop;
      tiles.forEach(t=>{
        if(s.seeds[crop]<=0)return;const f=s.fields[fieldIdx(t.tx,t.ty)];
        if(f.state!=="prepared")return;
        f.state="planted";f.growth=0;f.crop=crop;f.growMs=cropGrowMs(crop,s.season);s.seeds[crop]-=1;
      });
      logJournal(`Planted ${CROPS[crop].name} (${GROW_DAYS[crop][s.season]}d)`);
    }else if(task.kind==="harvest"){
      const totals={};
      tiles.forEach(t=>{
        const f=s.fields[fieldIdx(t.tx,t.ty)];
        if(f.state==="ready"&&f.crop){
          s.harvested[f.crop]+=CROPS[f.crop].yield;totals[f.crop]=(totals[f.crop]??0)+CROPS[f.crop].yield;
          f.state="empty";f.growth=0;f.growMs=0;f.crop=null;
        }
      });
      Object.keys(totals).forEach(c=>{
        addFloater(worker.x,worker.y-24,`+${totals[c]} ${CROPS[c].name}`,CROPS[c].fruit);
        logJournal(`Harvested ${totals[c]} ${CROPS[c].name}`);
      });
    }
  }

  /* ── Save / Load ── */
  function saveGame(){
    try{
      const s=stateRef.current;
      localStorage.setItem(SAVE_KEY,JSON.stringify({
        v:2,coins:s.coins,seeds:s.seeds,harvested:s.harvested,revenue:s.revenue,expenses:s.expenses,
        dayMs:s.dayMs,day:s.day,season:s.season,fluct:s.fluct,history:s.history,journal:s.journal,
        fields:s.fields,workers:s.workers.map(w=>({id:w.id,name:w.name,x:w.x,y:w.y,hair:w.hair,shirt:w.shirt,facing:w.facing,queue:w.queue,task:w.task})),
        selectedWorkerId:s.selectedWorkerId,cow:s.cow,equipment:s.equipment,nextId:nextId.current,
      }));
    }catch{}
  }
  function loadGame(){
    try{
      const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
      const d=JSON.parse(raw);if(!d||d.v!==2)return false;
      const s=stateRef.current;
      Object.assign(s,{coins:d.coins,seeds:{...emptySeeds(),...d.seeds},harvested:{...emptyInventory(),...d.harvested},
        revenue:d.revenue,expenses:d.expenses,dayMs:d.dayMs,day:d.day,season:d.season,
        fluct:{wheat:0,rice:0,corn:0,banana:0,milk:0,...d.fluct},
        history:{...s.history,...d.history},journal:d.journal??[],fields:d.fields??createFields(),
        workers:(d.workers??[]).map(w=>({...w,facing:w.facing??"down",queue:w.queue??[],task:w.task??null,workTimer:0,workTotal:0,walkPhase:0})),
        selectedWorkerId:d.selectedWorkerId??s.workers[0]?.id,
        cow:d.cow??s.cow,equipment:{manualPlow:false,tractor:false,harvester:false,...d.equipment},
      });
      if(s.workers.length===0)s.workers=[makeWorker("maya","Maya",10*TILE+TILE/2,4*TILE+TILE/2,COLORS.hairBlonde,COLORS.shirtRed)];
      nextId.current=d.nextId??1;
      s.seasonBanner={text:"",age:9999,ttl:1};
      syncUi(true);setUi(c=>({...c,banner:{...c.banner,visible:false}}));
      return true;
    }catch{return false;}
  }
  function resetGame(){
    try{localStorage.removeItem(SAVE_KEY);}catch{}
    const init=makeInitial();Object.assign(stateRef.current,init);nextId.current=1;
    setUi(c=>({...c,message:"Farm reset.",banner:{text:"Spring has arrived",visible:true}}));syncUi(true);
  }

  useEffect(()=>{
    loadGame();
    const iv=setInterval(saveGame,10000);
    const onHide=()=>{if(document.visibilityState==="hidden")saveGame();};
    document.addEventListener("visibilitychange",onHide);
    window.addEventListener("beforeunload",saveGame);
    return()=>{clearInterval(iv);document.removeEventListener("visibilitychange",onHide);window.removeEventListener("beforeunload",saveGame);saveGame();};
  },[]);

  useEffect(()=>{
    let raf=0;const tick=now=>{const s=stateRef.current;const dt=Math.min(50,now-s.lastTime);s.lastTime=now;update(dt);draw(now);raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf);
  },[]);

  function update(dt){
    const s=stateRef.current;s.dayMs+=dt;
    if(s.dayMs>=DAY_MS){
      s.dayMs-=DAY_MS;s.day+=1;
      const wage=s.workers.filter(w=>w.id!=="maya").length*12;
      const cost=DAILY_COST+wage;
      s.coins-=cost;s.expenses+=cost;
      addFloater(SHIPPING_BIN.x*TILE+TILE/2,SHIPPING_BIN.y*TILE-10,`-${cost}c daily`,COLORS.shirtRed);
      const ns=seasonForDay(s.day);
      if(ns!==s.season){
        s.season=ns;const txt=`${SEASON_LABEL[ns]} has arrived`;
        s.seasonBanner={text:txt,age:0,ttl:3500};logJournal(txt);
        setUi(c=>({...c,banner:{text:txt,visible:true}}));
      }
      PRODUCT_ORDER.forEach(id=>{s.fluct[id]=Math.floor(Math.random()*3)-1;});
      PRODUCT_ORDER.forEach(id=>{
        const arr=s.history[id];
        const price=id==="milk"?milkPriceFor(s.season,s.fluct.milk):cropPriceFor(id,s.season,s.fluct[id]);
        arr.push({day:s.day,price});if(arr.length>HISTORY_DAYS)arr.splice(0,arr.length-HISTORY_DAYS);
      });
    }
    const nightNow=isNightAt(s.dayMs);
    if(nightNow!==s.isNight){s.isNight=nightNow;logJournal(nightNow?"Workers stopped for the night (20:00)":"Workers resumed (06:00)");}
    if(s.seasonBanner){s.seasonBanner.age+=dt;if(s.seasonBanner.age>=s.seasonBanner.ttl&&ui.banner.visible)setUi(c=>c.banner.visible?{...c,banner:{...c.banner,visible:false}}:c);}
    s.fields.forEach(f=>{
      if(!f.crop)return;
      if(["planted","growing1","growing2","growing3"].includes(f.state)){
        f.growth+=dt;const total=f.growMs||cropGrowMs(f.crop,s.season),step=total/4;
        if(f.growth>=step*4)f.state="ready";else if(f.growth>=step*3)f.state="growing3";
        else if(f.growth>=step*2)f.state="growing2";else if(f.growth>=step)f.state="growing1";
      }
    });
    s.workers.forEach(w=>{
      if(!w.task&&w.queue.length>0&&!s.isNight)w.task=w.queue.shift()??null;
      if(!w.task)return;
      const targetX=w.task.tx*TILE+TILE/2,targetY=w.task.ty*TILE+TILE/2;
      const dx=targetX-w.x,dy=targetY-w.y,dist=Math.hypot(dx,dy);
      if(dist>2){
        const move=Math.min(dist,0.08*dt);w.x+=dx/dist*move;w.y+=dy/dist*move;
        w.walkPhase+=dt*0.012;w.facing=Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up");
      }else{
        if(w.workTimer===0){const dur=getTaskDuration(w.task.kind,s.equipment);w.workTotal=dur;w.workTimer=dur;}
        w.workTimer-=dt;
        if(w.workTimer<=0){completeTask(w);w.task=null;w.workTimer=0;w.workTotal=0;}
      }
    });
    s.floaters.forEach(f=>f.age+=dt);s.floaters=s.floaters.filter(f=>f.age<1400);
    const ps=0.3;
    if(s.keys.has("ArrowLeft")||s.keys.has("a"))s.camera.freeX-=ps*dt;
    if(s.keys.has("ArrowRight")||s.keys.has("d"))s.camera.freeX+=ps*dt;
    if(s.keys.has("ArrowUp")||s.keys.has("w"))s.camera.freeY-=ps*dt;
    if(s.keys.has("ArrowDown")||s.keys.has("s"))s.camera.freeY+=ps*dt;
    clampCam();s.camera.x+=(s.camera.freeX-s.camera.x)*Math.min(1,dt/120);s.camera.y+=(s.camera.freeY-s.camera.y)*Math.min(1,dt/120);
    syncUi();
  }

  function clampCam(){
    const s=stateRef.current;const wW=MAP_W*TILE,wH=MAP_H*TILE,vW=s.viewportW/s.cssScale,vH=s.viewportH/s.cssScale;
    s.camera.freeX=clamp(s.camera.freeX,0,Math.max(0,wW-vW));s.camera.freeY=clamp(s.camera.freeY,0,Math.max(0,wH-vH));
  }

  const lastSync=useRef(0);
  function syncUi(force=false){
    const now=performance.now();if(!force&&now-lastSync.current<120)return;lastSync.current=now;
    const s=stateRef.current,sel=selWorker();
    const tp=Math.floor((s.dayMs/DAY_MS)*16*60),tm=6*60+tp;
    const hh=String(Math.floor(tm/60)%24).padStart(2,"0"),mm=String(tm%60).padStart(2,"0");
    const workers=s.workers.map(w=>({id:w.id,name:w.name,status:workerStatus(w,s.isNight),currentTask:taskName(w.task),queueLength:w.queue.length,isSelected:w.id===s.selectedWorkerId}));
    const prices={wheat:currentPrice("wheat"),rice:currentPrice("rice"),corn:currentPrice("corn"),banana:currentPrice("banana"),milk:milkPriceFor(s.season,s.fluct.milk)};
    setUi(c=>({...c,coins:s.coins,seeds:{...s.seeds},harvested:{...s.harvested},revenue:s.revenue,expenses:s.expenses,
      day:s.day,time:`${hh}:${mm}`,season:s.season,prices,selectedWorkerId:sel.id,selectedWorkerName:sel.name,
      selectedStatus:workerStatus(sel,s.isNight),selectedCurrentTask:taskName(sel.task),selectedQueueLength:sel.queue.length,
      workers,cowReady:s.cow.lastMilkedDay!==s.day,isNight:s.isNight,equipment:{...s.equipment},
    }));
  }

  function draw(now){
    const canvas=canvasRef.current;if(!canvas)return;
    const s=stateRef.current,ctx=canvas.getContext("2d");if(!ctx)return;
    const vW=Math.floor(s.viewportW/s.cssScale),vH=Math.floor(s.viewportH/s.cssScale);
    if(canvas.width!==vW||canvas.height!==vH){canvas.width=vW;canvas.height=vH;}
    ctx.imageSmoothingEnabled=false;
    px(ctx,0,0,vW,vH,s.season==="winter"?"#c8e2f0":COLORS.sky);
    ctx.save();ctx.translate(-Math.round(s.camera.x),-Math.round(s.camera.y));
    for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++)drawGrassTile(ctx,x*TILE,y*TILE,x*31+y*17,s.season);
    for(let x=0;x<MAP_W;x++){px(ctx,x*TILE,14*TILE,TILE,TILE,COLORS.path);px(ctx,x*TILE+4,14*TILE+12,6,2,COLORS.pathDark);}
    for(let ty=FIELD_AREA.y0;ty<=FIELD_AREA.y1;ty++)for(let tx=FIELD_AREA.x0;tx<=FIELD_AREA.x1;tx++){
      const f=s.fields[fieldIdx(tx,ty)],x=tx*TILE,y=ty*TILE;
      if(f.state==="empty"){drawGrassTile(ctx,x,y,tx*11+ty*7,s.season);px(ctx,x+4,y+4,TILE-8,TILE-8,"rgba(90,58,32,0.18)");}
      else if(f.state==="prepared"||!f.crop)drawSoilTile(ctx,x,y,true);
      else drawCrop(ctx,x,y,f.state,f.crop);
    }
    ctx.strokeStyle=COLORS.woodDark;ctx.lineWidth=1;ctx.strokeRect(FIELD_AREA.x0*TILE+.5,FIELD_AREA.y0*TILE+.5,(FIELD_AREA.x1-FIELD_AREA.x0+1)*TILE-1,(FIELD_AREA.y1-FIELD_AREA.y0+1)*TILE-1);
    drawFarmhouse(ctx,FARMHOUSE.x*TILE,FARMHOUSE.y*TILE,FARMHOUSE.w*TILE,FARMHOUSE.h*TILE);
    drawRectBuilding(ctx,BARN.x*TILE,BARN.y*TILE,BARN.w*TILE,BARN.h*TILE,COLORS.roof,COLORS.roofDark);
    drawRectBuilding(ctx,COOP.x*TILE,COOP.y*TILE,COOP.w*TILE,COOP.h*TILE,COLORS.woodLight,COLORS.roof);
    drawRectBuilding(ctx,TOOLSHED.x*TILE,TOOLSHED.y*TILE,TOOLSHED.w*TILE,TOOLSHED.h*TILE,COLORS.wood,COLORS.stoneDark);
    drawWell(ctx,WELL.x*TILE,WELL.y*TILE);drawShippingBin(ctx,SHIPPING_BIN.x*TILE,SHIPPING_BIN.y*TILE);
    drawMilkingParlor(ctx,MILKING_PARLOR.x*TILE,MILKING_PARLOR.y*TILE,MILKING_PARLOR.w*TILE,MILKING_PARLOR.h*TILE);
    drawCow(ctx,s.cow.x,s.cow.y,s.cow.lastMilkedDay===s.day,now);
    drawSeasonTree(ctx,SEASON_TREE.x,SEASON_TREE.y,s.season,now);
    const pw=pointerWorld();
    if(pw){const htx=Math.floor(pw.x/TILE),hty=Math.floor(pw.y/TILE);
      if(htx>=0&&hty>=0&&htx<MAP_W&&hty<MAP_H){
        const valid=inField(htx,hty)||(htx===SHIPPING_BIN.x&&hty===SHIPPING_BIN.y)||inMilkingParlor(htx,hty);
        ctx.strokeStyle=valid?COLORS.white:"rgba(255,255,255,0.4)";ctx.strokeRect(htx*TILE+.5,hty*TILE+.5,TILE-1,TILE-1);
      }
    }
    [...s.workers].sort((a,b)=>a.y-b.y).forEach(w=>drawWorker(ctx,w,w.id===s.selectedWorkerId));
    s.floaters.forEach(f=>{
      const alpha=1-f.age/1400;ctx.globalAlpha=Math.max(0,alpha);
      ctx.font="8px monospace";ctx.fillStyle=COLORS.black;ctx.fillText(f.text,Math.round(f.x-12)+1,Math.round(f.y-f.age*0.03)+1);
      ctx.fillStyle=f.color;ctx.fillText(f.text,Math.round(f.x-12),Math.round(f.y-f.age*0.03));
      ctx.globalAlpha=1;
    });
    ctx.restore();
    const t=s.dayMs/DAY_MS,tint=t<0.1?(0.1-t)*4:t>0.85?(t-0.85)*4:0;
    if(tint>0){ctx.fillStyle=`rgba(40,30,80,${Math.min(0.45,tint)})`;ctx.fillRect(0,0,vW,vH);}
  }

  function pointerWorld(){
    const s=stateRef.current;if(s.pointer.x<0||s.pointer.y<0)return null;
    return{x:s.pointer.x/s.cssScale+s.camera.x,y:s.pointer.y/s.cssScale+s.camera.y};
  }
  function pointerToTile(){const pw=pointerWorld();if(!pw)return null;const tx=Math.floor(pw.x/TILE),ty=Math.floor(pw.y/TILE);if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return null;return{tx,ty};}
  function workerAtPointer(){const pw=pointerWorld();if(!pw)return null;return[...stateRef.current.workers].reverse().find(w=>Math.hypot(pw.x-w.x,pw.y-(w.y-10))<=18)??null;}

  useEffect(()=>{
    const obs=new ResizeObserver(()=>{const el=wrapRef.current;if(!el)return;const s=stateRef.current;s.viewportW=el.clientWidth;s.viewportH=el.clientHeight;const fit=Math.max(2,Math.floor(Math.min(s.viewportW/(MAP_W*TILE),s.viewportH/(MAP_H*TILE))));s.cssScale=Math.max(2,Math.min(3,fit));clampCam();});
    if(wrapRef.current)obs.observe(wrapRef.current);return()=>obs.disconnect();
  },[]);

  useEffect(()=>{
    const s=stateRef.current,canvas=canvasRef.current;if(!canvas)return;
    const getPos=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
    const onDown=e=>{const{x,y}=getPos(e);s.pointer={...s.pointer,x,y,downAt:performance.now(),dragging:false,startX:x,startY:y,startCamX:s.camera.x,startCamY:s.camera.y};e.target.setPointerCapture?.(e.pointerId);};
    const onMove=e=>{const{x,y}=getPos(e);s.pointer.x=x;s.pointer.y=y;if(s.pointer.downAt){const dx=x-s.pointer.startX,dy=y-s.pointer.startY;if(Math.hypot(dx,dy)>6){s.pointer.dragging=true;s.camera.freeX=s.pointer.startCamX-dx/s.cssScale;s.camera.freeY=s.pointer.startCamY-dy/s.cssScale;clampCam();}}};
    const onUp=()=>{const drag=s.pointer.dragging;s.pointer.downAt=null;s.pointer.dragging=false;if(drag)return;const w=workerAtPointer();if(w){selectWorker(w.id);return;}const t=pointerToTile();if(t)handleTileClick(t.tx,t.ty);};
    const onLeave=()=>{s.pointer.x=-1;s.pointer.y=-1;};
    const onKey=e=>s.keys.add(e.key),onKeyUp=e=>s.keys.delete(e.key);
    canvas.addEventListener("pointerdown",onDown);canvas.addEventListener("pointermove",onMove);canvas.addEventListener("pointerup",onUp);canvas.addEventListener("pointerleave",onLeave);
    window.addEventListener("keydown",onKey);window.addEventListener("keyup",onKeyUp);
    return()=>{canvas.removeEventListener("pointerdown",onDown);canvas.removeEventListener("pointermove",onMove);canvas.removeEventListener("pointerup",onUp);canvas.removeEventListener("pointerleave",onLeave);window.removeEventListener("keydown",onKey);window.removeEventListener("keyup",onKeyUp);};
  },[handleTileClick]);

  const buySeeds=(crop,count)=>{const s=stateRef.current;const cost=count*CROPS[crop].seedCost;if(s.coins<cost){setMessage(`Need ${cost}c for ${count} ${CROPS[crop].name} seeds.`);return;}s.coins-=cost;s.seeds[crop]+=count;s.expenses+=cost;addFloater(FARMHOUSE.x*TILE,FARMHOUSE.y*TILE+10,`-${cost}c`,COLORS.shirtRed);setMessage(`Bought ${count} ${CROPS[crop].name} seeds.`);syncUi(true);};
  const equipReq=id=>id==="tractor"?"manualPlow":id==="harvester"?"tractor":null;
  const buyEquip=id=>{const s=stateRef.current;if(s.equipment[id]){setMessage(`${EQUIPMENT_LABELS[id]} already owned.`);return;}const req=equipReq(id);if(req&&!s.equipment[req]){setMessage(`Requires ${EQUIPMENT_LABELS[req]} first.`);return;}const cost=EQUIPMENT_PRICES[id];if(s.coins<cost){setMessage(`Need ${cost}c for ${EQUIPMENT_LABELS[id]}.`);return;}s.coins-=cost;s.expenses+=cost;s.equipment[id]=true;addFloater(FARMHOUSE.x*TILE,FARMHOUSE.y*TILE+10,`-${cost}c`,COLORS.shirtRed);setMessage(`Bought ${EQUIPMENT_LABELS[id]}.`);logJournal(`Bought ${EQUIPMENT_LABELS[id]} (-${cost}c)`);syncUi(true);};
  const hireWorker=()=>{const s=stateRef.current;const cost=HIRE_COST_BASE*s.workers.length;if(s.coins<cost){setMessage(`Hiring costs ${cost}c. Earn more first.`);return;}s.coins-=cost;s.expenses+=cost;const idx=s.workers.length;const palette=[[COLORS.hairBrown,COLORS.shirtBlue],[COLORS.hairBlack,COLORS.shirtGreen],[COLORS.hairBlonde,COLORS.shirtBlue]];const[hair,shirt]=palette[(idx-1)%palette.length];const w=makeWorker(`worker-${idx}`,`Worker ${idx}`,(FARMHOUSE.x+1)*TILE+TILE/2,(FARMHOUSE.y+FARMHOUSE.h)*TILE+8,hair,shirt);s.workers.push(w);setMessage(`Hired ${w.name}. Select them to assign tasks.`);syncUi(true);};
  const centerOn=id=>{const s=stateRef.current;const w=s.workers.find(x=>x.id===id);if(!w)return;const vW=s.viewportW/s.cssScale,vH=s.viewportH/s.cssScale;s.camera.freeX=w.x-vW/2;s.camera.freeY=w.y-vH/2;clampCam();setMessage(`Centered on ${w.name}.`);};

  const dayPct=Math.min(100,Math.floor((stateRef.current.dayMs/DAY_MS)*100));
  const seasonIcon={spring:"🌸",summer:"☀️",autumn:"🍂",winter:"❄️"};
  const profit=ui.revenue-ui.expenses;

  /* ── RENDER ── */
  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>

        <Res icon={seasonIcon[ui.season]} label="Season" val={SEASON_LABEL[ui.season]}/>

        <Res icon={ui.isNight?"🌙":"☀️"} label="Phase" val={ui.isNight?"Night":"Day"}/>
        <div className="aoe-topbar-divider"/>

                {shopTab==="equipment"&&["manualPlow","tractor","harvester"].map(id=>{

                {PRODUCT_ORDER.map(id=>{
                  const hist=stateRef.current.history[id];
                  const color=id==="milk"?"#f0e0a0":CROPS[id]?.fruit??"#f0c030";
                  return(
                    <div key={id} className="item-card" style={{marginBottom:8}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                        <span className="item-name">{productName(id)}</span>
                        <span style={{color:"#f0d060",fontFamily:"'Cinzel',serif",fontSize:13,fontWeight:700}}>{ui.prices[id]}c</span>
                      </div>
                      <MiniChart data={hist} color={color}/>
                    </div>
                  );
                })}
                <button className="btn primary" style={{marginTop:8}} onClick={()=>setMarketOpen(false)}>Close</button>
              </div>
            </div>
          )}

          {/* JOURNAL MODAL */}
          {journalOpen&&(
            <div className="modal-overlay">
              <div className="modal-box" style={{minWidth:320}}>
                <div className="modal-title">📜 Farm Journal</div>
                <div style={{overflow:"auto",maxHeight:340}}>
                  {stateRef.current.journal.length===0&&<div style={{fontSize:10,color:"#7a6a48",padding:"10px 0"}}>No events yet.</div>}
                  {stateRef.current.journal.map((e,i)=>(
                    <div key={i} className="journal-entry">
                      <span className="journal-day">Day {e.day} · {SEASON_LABEL[e.season]}</span>{e.text}
                    </div>
                  ))}
                </div>
                <button className="btn primary" style={{marginTop:10}} onClick={()=>setJournalOpen(false)}>Close</button>
              </div>
            </div>
          )}
        </div>

        {/* RIGHT PANEL */}
        <div className="right-panel">
          <Panel title="Selected Unit">
            <SL label="Name"   val={ui.selectedWorkerName}/>
            <SL label="Status" val={ui.selectedStatus}/>
            <SL label="Task"   val={ui.selectedCurrentTask}/>
            <SL label="Queue"  val={`${ui.selectedQueueLength}`}/>
          </Panel>

          <Panel title="Workers">
            {ui.workers.map(w=>(
              <div key={w.id} className={`worker-row${w.isSelected?" selected":""}`}>
                <button className="worker-main" onClick={()=>selectWorker(w.id)}>
                  <div className={`worker-name${w.isSelected?" selected":""}`}>{w.name}</div>
                  <div className="worker-sub">{w.status} · Queue: {w.queueLength}</div>
                </button>
                <button className="worker-find" onClick={()=>centerOn(w.id)}>Find</button>
              </div>
            ))}
            <button className="btn primary" style={{marginTop:4}} onClick={hireWorker}>+ Hire Worker — {HIRE_COST_BASE*ui.workers.length}c</button>
          </Panel>

          <Panel title="Actions">
            <button className="btn primary" onClick={()=>setShopOpen(true)}>🏪 Farm Supply Store</button>
            <button className="btn accent"  onClick={()=>setMarketOpen(true)}>📊 Market &amp; Prices</button>
            <button className="btn"         onClick={()=>setJournalOpen(true)}>📜 Farm Journal</button>
          </Panel>

          <Panel title="Equipment">
            {["manualPlow","tractor","harvester"].map(id=>(
              <SL key={id} label={EQUIPMENT_LABELS[id]} val={ui.equipment[id]?"✓ Owned":"Not owned"} cls={ui.equipment[id]?"green":undefined}/>
            ))}
          </Panel>

          <Panel title="Milking Parlor">
            <SL label="Cow" val={ui.cowReady?"Ready to milk":"Milked today"} cls={ui.cowReady?"green":""}/>
            <div style={{fontSize:9,color:"#7a6a48",marginTop:3,lineHeight:1.6}}>Select a worker, then click the cow (+{MILK_YIELD} Milk).</div>
          </Panel>

          <Panel title="Market Prices">
            {PRODUCT_ORDER.map(id=><SL key={id} label={productName(id)} val={`${ui.prices[id]}c`}/>)}
          </Panel>

          <Panel title="Inventory">
            <div className="inv-section">Seeds</div>
            {CROP_ORDER.map(id=><SL key={`s-${id}`} label={CROPS[id].name} val={`${ui.seeds[id]}`}/>)}
            <div className="inv-section">Harvested</div>
            {PRODUCT_ORDER.map(id=><SL key={`h-${id}`} label={productName(id)} val={`${ui.harvested[id]}`}/>)}
          </Panel>

          <Panel title="How to Play">
            <ol style={{fontSize:10,lineHeight:1.8,paddingLeft:14,color:"#d8c89a"}}>
              <li>Click a worker to select them.</li>
              <li>Click empty soil → prepare it.</li>
              <li>Click prepared soil → choose a crop.</li>
              <li>Click the cow → milk it (once/day).</li>
              <li>Click ripe crops → then shipping bin.</li>
            </ol>
            <div style={{fontSize:9,color:"#7a6a48",marginTop:4}}>Drag map or use WASD / arrow keys to pan.</div>
            <button className="btn danger" style={{marginTop:6}} onClick={()=>{if(window.confirm("Reset farm? All progress will be lost."))resetGame();}}>⚠ Reset Farm</button>
          </Panel>
        </div>
      </div>
    </div>
  );
}

/* ── Small UI helpers ── */
function Res({icon,label,val,cls}){
  return(
    <div className="aoe-resource">
      <span className="aoe-resource-icon">{icon}</span>
      <div style={{display:"flex",flexDirection:"column"}}>
        <span className="aoe-resource-label">{label}</span>
        <span className={`aoe-resource-value${cls?" "+cls:""}`}>{val}</span>
      </div>
    </div>
  );
}
function Panel({title,children}){
  return(
    <div className="aoe-panel">
      <div className="panel-title">{title}</div>
      {children}
    </div>
  );
}
function SL({label,val,cls}){
  return(
    <div className="status-line">
      <span className="status-lbl">{label}</span>
      <span className={`status-val${cls?" "+cls:""}`}>{val}</span>
    </div>
  );
}

/* ── Mount ── */
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(KidFarmGame));
</script>
</body>
</html>
